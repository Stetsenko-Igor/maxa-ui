<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MAXA Token Importer v10</title>
  <style>
    html { height: 100%; }
    body {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      font-family: Inter, system-ui, sans-serif;
      margin: 0;
      padding: 16px;
      color: #111;
    }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { font-size: 12px; line-height: 1.45; color: #555; margin: 0 0 12px; }
    .dropzone {
      flex: 0 0 auto;
      border: 1px dashed #bbb;
      border-radius: 10px;
      padding: 12px;
      background: #fafafa;
      margin-bottom: 12px;
      font-size: 12px;
      color: #444;
    }
    .dropzone.is-active {
      border-color: #111;
      background: #f3f3f3;
    }
    .editor {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-height: 0;
    }
    textarea {
      width: 100%; min-height: 220px; flex: 1 1 auto; resize: vertical; box-sizing: border-box;
      padding: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px; border: 1px solid #ddd; border-radius: 8px;
    }
    .row { display: flex; flex: 0 0 auto; gap: 8px; margin-top: 12px; }
    .option {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.4;
      color: #333;
    }
    .option input { margin-top: 2px; }
    .option strong { display: block; color: #111; }
    .option span { display: block; color: #666; }
    button { border: 0; border-radius: 8px; padding: 10px 12px; cursor: pointer; font-size: 12px; font-weight: 600; }
    button[disabled] { opacity: 0.55; cursor: not-allowed; }
    .primary { background: #111; color: white; }
    .secondary { background: #f3f3f3; color: #111; }
    .log {
      flex: 0 0 auto;
      min-height: 220px;
      max-height: 280px;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: auto;
      background: #fafafa;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>MAXA Token Importer v10</h1>
  <p>Choose or drag the generated `import-bundle.json`. A full type, mode, alias, cycle, and CSS-expression preflight runs before Figma is changed.</p>
  <div class="dropzone" id="dropzone">
    Drop the generated `packages/tokens/figma/import-bundle.json` here.
    <div class="row">
      <button class="secondary" id="loadLatestBtn" type="button">Load latest from GitHub</button>
      <button class="secondary" id="chooseFilesBtn" type="button">Choose files</button>
      <input id="fileInput" type="file" accept=".json,application/json" multiple hidden />
    </div>
  </div>
  <div class="editor">
    <textarea id="jsonInput"></textarea>
    <label class="option" for="removeStaleVariables">
      <input id="removeStaleVariables" type="checkbox" />
      <span>
        <strong>Remove stale variables during import</strong>
        <span>Delete variables from imported collections when they exist in Figma but are missing from the bundle.</span>
      </span>
    </label>
    <label class="option" for="recreateWrongTypes">
      <input id="recreateWrongTypes" type="checkbox" />
      <span>
        <strong>Recreate wrong-type variables</strong>
        <span>Required only for stale STRING placeholders. This changes affected variable IDs; leave off for normal imports.</span>
      </span>
    </label>
    <div class="row">
      <button class="primary" id="importBtn">Import tokens + styles</button>
      <button class="secondary" id="exportBtn">Export variables</button>
      <button class="secondary" id="closeBtn">Close</button>
    </div>
    <div class="log" id="log">Ready. UI loaded: v10.</div>
  </div>
  <script>
    const BUNDLE_URL = 'https://raw.githubusercontent.com/Stetsenko-Igor/maxa-ui/main/packages/tokens/figma/import-bundle.json';
    const importBtn = document.getElementById('importBtn');
    const exportBtn = document.getElementById('exportBtn');
    const closeBtn = document.getElementById('closeBtn');
    const loadLatestBtn = document.getElementById('loadLatestBtn');
    const chooseFilesBtn = document.getElementById('chooseFilesBtn');
    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    const input = document.getElementById('jsonInput');
    const removeStaleVariablesInput = document.getElementById('removeStaleVariables');
    const recreateWrongTypesInput = document.getElementById('recreateWrongTypes');
    const log = document.getElementById('log');
    let currentLogs = ['Ready. UI loaded: v10.'];
    let isImporting = false;

    function setLog(lines) {
      currentLogs = lines;
      log.textContent = lines.join('\n');
      log.scrollTop = log.scrollHeight;
    }

    function appendLog(line) {
      currentLogs = [...currentLogs, line];
      log.textContent = currentLogs.join('\n');
      log.scrollTop = log.scrollHeight;
    }

    function setImporting(nextValue) {
      isImporting = nextValue;
      importBtn.disabled = nextValue;
      loadLatestBtn.disabled = nextValue;
      chooseFilesBtn.disabled = nextValue;
      closeBtn.disabled = nextValue;
      fileInput.disabled = nextValue;
      input.disabled = nextValue;
      removeStaleVariablesInput.disabled = nextValue;
      recreateWrongTypesInput.disabled = nextValue;
    }

    async function loadLatestBundleFromGitHub() {
      if (isImporting) return;

      loadLatestBtn.disabled = true;
      chooseFilesBtn.disabled = true;
      input.disabled = true;
      setLog([
        'Loading latest import-bundle.json from GitHub...',
        BUNDLE_URL,
      ]);

      try {
        const response = await fetch(`${BUNDLE_URL}?t=${Date.now()}`, {
          method: 'GET',
          cache: 'no-store',
        });

        if (!response.ok) {
          throw new Error(`GitHub request failed: ${response.status} ${response.statusText}`);
        }

        const bundle = await response.json();
        if (!bundle || typeof bundle !== 'object' || !bundle.collections) {
          throw new Error('Downloaded JSON is not a valid MAXA import bundle.');
        }

        input.value = JSON.stringify(bundle, null, 2);
        setLog([
          'Loaded latest import-bundle.json from GitHub.',
          `Collections: ${Object.keys(bundle.collections).join(', ')}`,
          'Review if needed, then click "Import tokens + styles".',
        ]);
      } catch (error) {
        setLog([
          'Failed to load latest bundle from GitHub.',
          error && error.message ? error.message : String(error),
          'Fallback: drag import-bundle.json into the plugin or paste it manually.',
        ]);
      } finally {
        loadLatestBtn.disabled = false;
        chooseFilesBtn.disabled = false;
        input.disabled = false;
      }
    }

    importBtn.onclick = () => {
      if (isImporting) return;
      setImporting(true);
      parent.postMessage({
        pluginMessage: {
          type: 'import-tokens',
          payload: input.value,
          options: {
            removeStaleVariables: removeStaleVariablesInput.checked,
            recreateWrongTypes: recreateWrongTypesInput.checked,
          },
        },
      }, '*');
      setLog([
        'Import started...',
        'Running preflight before any Figma changes...',
        recreateWrongTypesInput.checked
          ? 'Wrong-type recreation is enabled; affected variable IDs may change.'
          : 'Wrong-type recreation is disabled.',
      ]);
    };

    let isExporting = false;

    exportBtn.onclick = () => {
      if (isExporting) return;
      isExporting = true;
      exportBtn.disabled = true;
      parent.postMessage({ pluginMessage: { type: 'export-variables' } }, '*');
      setLog(['Export started...', 'Reading local variable collections...']);
    };

    function downloadJson(filename, data) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    closeBtn.onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'close-plugin' } }, '*');
    };

    loadLatestBtn.onclick = loadLatestBundleFromGitHub;
    chooseFilesBtn.onclick = () => fileInput.click();
    fileInput.onchange = async (event) => {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;
      await populateBundleFromFiles(files);
      event.target.value = '';
    };

    ['dragenter', 'dragover'].forEach((eventName) => {
      dropzone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropzone.classList.add('is-active');
      });
    });

    ['dragleave', 'drop'].forEach((eventName) => {
      dropzone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropzone.classList.remove('is-active');
      });
    });

    dropzone.addEventListener('drop', async (event) => {
      const files = Array.from(event.dataTransfer?.files || []);
      if (!files.length) return;
      await populateBundleFromFiles(files);
    });

    async function populateBundleFromFiles(files) {
      try {
        setLog([`Reading ${files.length} file(s)...`]);
        const bundle = await buildBundleFromFiles(files);
        input.value = JSON.stringify(bundle, null, 2);
        setLog([`Prepared import bundle from ${files.length} file(s).`]);
      } catch (error) {
        setLog([error && error.message ? error.message : String(error)]);
      }
    }

    async function buildBundleFromFiles(files) {
      const byName = new Map();
      for (const file of files) {
        byName.set(file.name, JSON.parse(await file.text()));
      }

      if (!byName.has('import-bundle.json')) {
        throw new Error('Use the generated import-bundle.json. Raw manifest/token files are not accepted because they have not passed repository preflight.');
      }
      return byName.get('import-bundle.json');
    }

    window.onmessage = (event) => {
      const message = event.data.pluginMessage;
      if (!message) return;
      if (message.type === 'import-progress' && message.entry) {
        appendLog(`[${message.entry.level}] ${message.entry.text}`);
        return;
      }
      if (message.type === 'import-result') {
        setImporting(false);
        const lines = (message.logs || []).map((item) => `[${item.level}] ${item.text}`);
        setLog(lines.length ? lines : ['Done.']);
      }
      if (message.type === 'export-result') {
        isExporting = false;
        exportBtn.disabled = false;
        const lines = (message.logs || []).map((item) => `[${item.level}] ${item.text}`);
        setLog(lines.length ? lines : ['Done.']);
        if (message.ok && message.bundle) {
          const stamp = new Date().toISOString().slice(0, 10);
          downloadJson(`maxa-figma-export-${stamp}.json`, message.bundle);
          appendLog(`[info] Downloaded maxa-figma-export-${stamp}.json — hand this to Claude to diff against the repo (packages/tokens/scripts/diff-figma-export.mjs).`);
        }
      }
    };
  </script>
</body>
</html>
